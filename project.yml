name: P4CANConsole
options:
  bundleIdPrefix: com.p4can
  deploymentTarget:
    iOS: "16.0"
  createIntermediateGroups: true
  groupSortPosition: top

targets:
  P4CANConsole:
    type: application
    platform: iOS
    sources:
      - path: P4CANConsole
        excludes:
          - "Info.plist"
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.p4can.console
        PRODUCT_NAME: P4CANConsole
        INFOPLIST_FILE: P4CANConsole/Info.plist
        GENERATE_INFOPLIST_FILE: NO
        MARKETING_VERSION: "1.0"
        CURRENT_PROJECT_VERSION: "1"
        IPHONEOS_DEPLOYMENT_TARGET: "16.0"
        SWIFT_VERSION: "5.0"
        TARGETED_DEVICE_FAMILY: "1,2"
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        ASSETCATALOG_COMPILER_GLOBAL_ACCENT_COLOR_NAME: AccentColor
        CODE_SIGN_STYLE: Automatic
        ENABLE_PREVIEWS: YES
        SWIFT_EMIT_LOC_STRINGS: YES

schemes:
  P4CANConsole:
    build:
      targets:
        P4CANConsole: all
    run:
      config: Debug
    archive:
      config: Release
